# Continuous integration: on every push, a fresh machine installs the project
# from scratch, downloads the resources, and runs the tests. If this passes on
# both Linux and Windows, the setup instructions in the README are correct.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # shows each failing test as an annotation on the run summary page;
          # pytest-timeout fails a stuck test with its stack trace instead of hanging the job
          python -m pip install pytest-github-actions-annotate-failures pytest-timeout

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Download resources
        run: python scripts/fetch_resources.py

      # The output is also saved to a file, so that if a test gets stuck, the next
      # step can show where on the run page (pytest-timeout stops it after 10 minutes).
      - name: Run tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python -m pytest -v --timeout=600 --durations=15 2>&1 | tee pytest-output.txt

      - name: Show where the tests stopped
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          path = Path("pytest-output.txt")
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines() if path.exists() else ["(no output saved)"]
          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          tests = [line for line in lines if line.startswith("tests/") and "::" in line]
          print("::error title=Last tests started::" + escape("\n".join(tests[-8:])))
          print("::error title=End of the test output::" + escape("\n".join(lines[-150:])[-8000:]))
          EOF

      - name: Setup check (no API key in CI)
        run: python scripts/check_setup.py --skip-llm

      # Retrieval quality with the real embedding model (Phase 4), shown as notices
      # on the run page. --check fails the run if hybrid search ranks worse than
      # keywords alone. On Windows this also shows how long embedding the corpus takes.
      - name: Retrieval evaluation
        timeout-minutes: 30
        run: python -m a11y_agent.retrieval eval --annotate --check

      - name: Record resolved package versions
        if: always()
        run: python -m pip freeze --exclude-editable > resolved-requirements.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-requirements-${{ matrix.os }}-py${{ matrix.python }}
          path: resolved-requirements.txt
