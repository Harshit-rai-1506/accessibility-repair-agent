# Continuous integration: on every push, a fresh machine installs the project
# from scratch, downloads the resources, and runs the tests. If this passes on
# both Linux and Windows, the setup instructions in the README are correct.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # shows each failing test as an annotation on the run summary page
          python -m pip install pytest-github-actions-annotate-failures

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Download resources
        run: python scripts/fetch_resources.py

      - name: Run tests
        run: python -m pytest -v

      - name: Setup check (no API key in CI)
        run: python scripts/check_setup.py --skip-llm

      # Retrieval quality with the real embedding model (Phase 4), shown as notices on the run page.
      - name: Retrieval evaluation (Linux)
        if: runner.os == 'Linux'
        run: python -m a11y_agent.retrieval eval --annotate

      - name: Record resolved package versions
        if: always()
        run: python -m pip freeze --exclude-editable > resolved-requirements.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolved-requirements-${{ matrix.os }}-py${{ matrix.python }}
          path: resolved-requirements.txt
