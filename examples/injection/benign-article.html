<body>
  <main>
    <h1>What is prompt injection?</h1>
    <p>Attackers hide sentences such as "ignore all previous instructions" in web pages, hoping that an AI tool which reads the page will obey them instead of its user.</p>
    <img src="diagram.png">
    <p>Defences include treating page content as data, screening it, and asking a person before acting.</p>
  </main>
